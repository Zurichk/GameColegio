server {
    # Puerto interno del contenedor. En Coolify se mapea al puerto externo
    # que se quiera (el 80 puede estar ocupado por otra web del servidor).
    listen 5005;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Los .wasm deben servirse con el MIME correcto; si no, el navegador
    # rechaza el módulo (Bevy/WASM exige application/wasm).
    location ~* \.wasm$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        types {
            application/wasm wasm;
        }
        default_type application/wasm;
        try_files $uri =404;
    }

    # Assets (fuentes, sonidos): caché larga, son inmutables en build.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # La página principal.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Headers de seguridad básicos.
    add_header X-Content-Type-Options nosniff always;
}