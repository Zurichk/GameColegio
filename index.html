<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Colegio</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
            background: #05060f;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #cfe0ff;
            font-family: system-ui, sans-serif;
            font-size: 1.4rem;
            letter-spacing: 0.08em;
            z-index: 10;
            background: #05060f;
        }
        #loading.hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">Cargando Game Colegio…</div>
    <script type="module">
        import init from "./gamecolegio.js";

        async function main() {
            try {
                await init();
            } catch (err) {
                document.getElementById("loading").textContent =
                    "No se pudo iniciar el juego (¿WebGL2 no disponible?): " + err;
            }
        }
        main();
    </script>
</body>
</html>
